{% extends 'main.html' %}
{% load static %} 
{% block content %}

<div class="container-fluid mt-4">

    <div class="card p-4 edit-task-card">

        <h3 class="page-title mb-3">Edit Task</h3>

        <!-- EDIT FORM -->
        <form method="POST">
            {% csrf_token %}

            <!-- TITLE -->
            <div class="mb-3">
                <label class="form-label">Task Title</label>
                <input type="text"
                       name="title"
                       value="{{ task.title }}"
                       class="form-control"
                       required>
            </div>
            <!---Description-->
            {% if not task.is_quick_task %}

                <div class="mb-3">
                    <label class="form-label">Description</label>
                
                    <textarea
                        name="desc"
                        class="form-control"
                        rows="4"
                        placeholder="Break down your task into smaller steps..."
                    >{{ task.description }}</textarea>
                </div>

            {% endif %}

            <!-- PRIORITY -->
            <div class="mb-3">
                <label class="form-label">Priority</label>
                <select name="priority" class="form-select">
                    <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>Low</option>
                    <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>Medium</option>
                    <option value="High" {% if task.priority == "High" %}selected{% endif %}>High</option>
                </select>
            </div>

            <!-- DUE DATE -->
            {% if not task.is_quick_task %}
                <div class="mb-3">
                    <label class="form-label">Due Date</label>
                    <input type="date"
                           name="due_date"
                           value="{{ task.due_date|date:'Y-m-d' }}"
                           class="form-control">
                </div>
            {% endif %}
            <!-- BUTTONS -->
            <div class="d-flex gap-2 mt-4">

                <button type="submit" class="btn btn-outline-success">
                    Save Changes
                </button>

                {% if task.is_quick_task %}

                <a href="{% url 'dashboard' %}" class="btn btn-outline-danger">
                    Cancel
                </a>

                {% else %}

                <a href="{% url 'tasks' %}" class="btn btn-outline-danger">
                    Cancel
                </a>

                {% endif %}

            </div>

        </form>

    </div>

</div>

{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/task.css' %}">
{% endblock %}

{% for task in tasks %}

                <div class="card task-card mb-3 p-3">

                    {% if task.completed %}

                        <!-- COMPLETED TASK -->
                        <div class="d-flex justify-content-between align-items-center">

                            <div>

                                <strong style="text-decoration: line-through;">
                                    {{ task.title }}
                                </strong>

                                    {% if task.is_quick_task %}
                                        <span class="badge bg-secondary ms-2">
                                            Quick Task
                                        </span>
                                    {% endif %}

                                <br>

                                <small class="text-muted">

                                    <!---Priority:
                                    {{ task.priority }}

                                    |

                                    Due:
                                    {{ task.due_date|default:"No Date" }}--->

                                </small>

                            </div>
                            <button class="btn btn-sm btn-outline-danger delete-task" data-id="{{ task.id }}">
                                    Delete
                            </button>

                        </div>

                    {% else %}

                        <!-- ACTIVE TASK -->
                        <div class="d-flex justify-content-between align-items-center">

                            <!-- COMPLETE -->
                            <div class="d-flex align-items-center">

                                <input type="checkbox"
                                        class="task-complete me-3"
                                        data-id="{{ task.id }}"
                                        {% if task.completed %}checked{% endif %}>                            
                                <div>

                                    <strong>
                                        {{ task.title }}
                                    </strong>

                                    {% if task.is_quick_task %}
                                        <span class="badge bg-secondary ms-2">
                                            Quick Task
                                        </span>
                                    {% endif %}

                                    <br>

                                    <small class="text-muted">

                                        <!---Priority:
                                        {{ task.priority }}

                                        |

                                        Due:
                                        {{ task.due_date|default:"No Date" }}--->

                                    </small>

                                </div>

                            </div>

                            <!-- ACTIONS -->
                            <div class="d-flex">

                                <!-- EDIT -->
                                <a
                                    href="{% url 'edit_task' task.id %}"
                                    class="btn btn-sm btn-outline-primary"
                                >

                                    Edit

                                </a>

                                <button
                                    type="button"
                                    class="btn btn-sm btn-outline-danger delete-task ms-2"
                                    data-id="{{ task.id }}">
                                    Delete
                                </button>

                            </div>

                        </div>

                    {% endif %}

                </div>
                {% empty %}
                <div class="text-center text-muted py-4">
                    No tasks found.
                </div>

            {% endfor %}
